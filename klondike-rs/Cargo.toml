[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
lonelybot = { path = "../lonelybot" }
rand = { version = "0.8.5", features = ["small_rng"] }
tch = "0.23"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
bincode = "1"
anyhow = "1"
