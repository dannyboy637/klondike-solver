[package]
name = "klondike-train"
version = "0.1.0"
edition = "2021"

[dependencies]
klondike-core = { path = "../klondike-core" }
klondike-search = { path = "../klondike-search" }
klondike-nn = { path = "../klondike-nn" }
klondike-eval = { path = "../klondike-eval" }
lonelybot = { workspace = true }
rand = { workspace = true }
tch = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "monitor"
path = "src/bin/monitor.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[[bin]]
name = "convert-weights"
path = "src/bin/convert_weights.rs"
